[project]
name = "tiktok-account-forge"
version = "0.7.3"
description = "Windows desktop TikTok account generator — batch profile provisioning, device fingerprint rotation, and session warmup."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "forge-lab", email = "dev@forge-lab.sh" }]
keywords = ["tiktok", "account-generator", "automation", "desktop", "windows"]

dependencies = [
    "httpx[http2]==0.27.2",
    "playwright==1.47.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "rich==13.9.2",
    "typer==0.12.5",
    "tenacity==9.0.0",
    "fake-useragent==1.5.1",
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "ruff==0.6.9", "mypy==1.11.2"]
build = ["pyinstaller==6.10.0"]

[project.scripts]
forge = "forge.bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true